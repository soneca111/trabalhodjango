{% extends "_layout.html" %}

{% block content %}
<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h3 class="card-title m-0">{{titulo}}</h3>
    </div>
    <div class="card-body">
      <form method="POST">
        {% csrf_token %}
        
        {{ form.as_p }}  <!-- O Django renderiza todos os inputs formatados automaticamente -->

        <div class="d-flex gap-2 mt-3">
          <button type="submit" class="btn btn-success">{{botao}}</button>
          <a href="{% url 'remedio' %}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
